<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lyra Avatar</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main id="stage">
      <section id="avatar" class="avatar idle neutral">
        <img id="base" class="layer base" alt="Lyra" />
        <img id="eyes" class="layer eyes" alt="" />
        <img id="mouth" class="layer mouth" alt="" />
      </section>
      <div id="status">Ctrl+Shift+L: click-through</div>
    </main>
    <script src="renderer.js"></script>
  </body>
</html>
